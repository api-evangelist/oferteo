aid: oferteo
name: Oferteo
description: >-
  Oferteo (oferteo.pl) is a Polish online services marketplace that connects
  people and businesses seeking services (Zlecający) with local contractors and
  service providers (Wykonawcy). Clients post a request across hundreds of
  categories — construction and renovation, IT, legal, health, events, transport
  and more — and matched providers respond with competitive quotes. The platform
  layers on verified reviews, a buyer-protection program (Ochrona Zlecających),
  and native iOS/Android apps for both sides of the marketplace. Oferteo operates
  nationwide across Poland and reports tens of millions of submitted requests and
  offers, millions of registered clients, and hundreds of thousands of registered
  providers. It was surfaced as a portfolio company of Point Nine and added to the
  API Evangelist network. No public developer API surface was found during
  enrichment; this profile currently carries verified identity, website
  link-properties, and infrastructure/security probes.
